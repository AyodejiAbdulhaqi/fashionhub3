<form class="contact-form"
      action="https://formsubmit.co/ayojboy6@gmail.com"
      method="POST">

```
<!-- Email subject -->
<input type="hidden"
       name="_subject"
       value="New FashionHub Contact Message">

<!-- Disable CAPTCHA -->
<input type="hidden"
       name="_captcha"
       value="false">

<!-- Email template -->
<input type="hidden"
       name="_template"
       value="table">

<!-- Spam protection -->
<input type="text"
       name="_honey"
       style="display:none">

<!--
    After the message is sent, the visitor will be redirected here.
    Replace this with your actual website URL.
-->
<input type="hidden"
       name="_next"
       value="file:///C:/Users/user/Desktop/vte/index.html">

<!-- Customer's name -->
<input
    type="text"
    name="name"
    placeholder="Full Name"
    autocomplete="name"
    required
>

<!-- Customer's email -->
<input
    type="email"
    name="email"
    placeholder="Email Address"
    autocomplete="email"
    required
>

<!-- Customer's message -->
<textarea
    name="message"
    placeholder="If you want to sell your products, or if you want to make enquiries"
    rows="6"
    required
></textarea>

<!-- Submit -->
<button type="submit">
    Send Message
</button>
